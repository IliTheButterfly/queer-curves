apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Every resource is named `queer-curves-*`. The target namespace is shared with
# unrelated production workloads, so an unprefixed name would leave it ambiguous
# which workloads are ours — and ambiguity there is what makes a cleanup command
# dangerous.

resources:
  - pvc.yaml
  - config.yaml
  - synapse.yaml

labels:
  # includeSelectors is off, and the selectors are written out by hand in
  # synapse.yaml instead. Label selectors are immutable once a Deployment
  # exists, so having kustomize inject them would mean a future edit to this
  # block could only be applied by deleting the Deployment.
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: queer-curves
      app.kubernetes.io/part-of: queer-curves
