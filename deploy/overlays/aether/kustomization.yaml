apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The `aether` cluster. The namespace is pinned here rather than left to the
# caller's current context: the target namespace is shared with unrelated
# production workloads, and `kubectl apply -k` against whatever namespace
# happened to be current is not a mistake worth leaving available.
namespace: ili

resources:
  - ../../base
