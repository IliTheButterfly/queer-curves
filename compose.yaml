# Local Synapse homeserver for queer-curves development.
#
# Bound to 127.0.0.1, federation off. Bootstrap and lifecycle are handled by
# scripts/dev-matrix.sh — that script generates a fresh homeserver.yaml on
# first run, patches in dev-only overrides (open registration, slack
# rate-limits), and then starts this service. Do not expose to the network.
#
# The synapse image's entrypoint starts as container-root, chowns /data to
# UID:GID and drops privileges via gosu before running the server. Passing
# UID/GID env vars lets it pick the developer's host UID/GID, so the files
# in ./data end up host-owned. scripts/dev-matrix.sh exports MATRIX_UID and
# MATRIX_GID from `id -u` / `id -g` before invoking compose; the defaults
# are a fallback for direct `docker compose up` on typical Linux layouts.
# We deliberately don't set the compose `user:` field — that would force
# the entrypoint to skip the chown step.

services:
  synapse:
    image: matrixdotorg/synapse:v1.122.0
    container_name: queer-curves-synapse
    environment:
      SYNAPSE_SERVER_NAME: localhost
      SYNAPSE_REPORT_STATS: 'no'
      UID: '${MATRIX_UID:-1000}'
      GID: '${MATRIX_GID:-1000}'
    volumes:
      - ./data/synapse:/data
    ports:
      - '127.0.0.1:8008:8008'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8008/health']
      interval: 10s
      timeout: 3s
      retries: 10
